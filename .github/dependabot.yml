version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "pub"
    directory: "/src/flutter/local_whisper"
    schedule:
      interval: "monthly"
    groups:
      flutter:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/src/flutter/local_whisper/android"
    schedule:
      interval: "monthly"
    groups:
      android:
        patterns: ["*"]
