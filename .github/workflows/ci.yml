name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "README.md"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "README.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes and setup.sh syntax check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      flutter: ${{ steps.filter.outputs.flutter }}

    steps:
      - uses: actions/checkout@v7

      - name: Detect changed surfaces
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            swift:
              - "LocalWhisperUI/**"
              - ".github/workflows/ci.yml"
            flutter:
              - "src/flutter/**"
              - ".github/workflows/ci.yml"

      - name: Check setup.sh and install.sh syntax
        run: bash -n setup.sh && bash -n install.sh

  python-checks:
    name: Python checks
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install locked dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Import smoke test
        run: |
          python -c "
          from whisper_voice.app import App
          from whisper_voice.ipc_server import IPCServer
          from whisper_voice.config import get_config
          from whisper_voice.transcriber import Transcriber
          from whisper_voice.audio import Recorder
          from whisper_voice.audio_processor import AudioProcessor
          from whisper_voice.grammar import Grammar
          from whisper_voice.backup import Backup
          print('All imports OK')
          "

      - name: Unit tests
        run: python -m pytest tests/ -v --ignore=tests/test_flow.py

  swift-build:
    name: Swift build
    needs: changes
    if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_26" ]; then
            sudo xcode-select -s "$XCODE_26"
            echo "Using $XCODE_26"
          else
            echo "::error::Xcode 26 is required for the Swift release checks"
            exit 1
          fi

      - name: Build Swift package
        run: cd LocalWhisperUI && swift build -c release

      - name: Test native speech core
        run: cd LocalWhisperUI && swift test

  flutter-checks:
    name: Flutter mobile checks
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/flutter/local_whisper

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Flutter widget tests
        run: flutter test
